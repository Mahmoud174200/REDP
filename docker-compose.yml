version: '3.8'

services:
  # ─── MySQL Database Server ───
  mysql:
    image: mysql:8.0
    container_name: redp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: redp_db
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache & Messaging Server ───
  redis:
    image: redis:7-alpine
    container_name: redp-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
